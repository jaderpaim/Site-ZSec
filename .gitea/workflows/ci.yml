name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: lab
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Checagem de tipos
        run: bunx tsc --noEmit -p .
      - name: Build
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

