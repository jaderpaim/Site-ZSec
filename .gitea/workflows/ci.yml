name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Checagem de tipos
        run: bunx tsc --noEmit -p .
      - name: Build
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
  segredos:
    runs-on: lab
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # histórico completo: segredo apagado num commit antigo continua no git
      - name: Instalar Gitleaks
        run: |
          cd /tmp
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfLO $base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO $base/gitleaks_${GITLEAKS_VERSION}_checksums.txt
          grep linux_x64.tar.gz gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz gitleaks
          install gitleaks /usr/local/bin/
      - name: Procurar segredos no histórico
        run: gitleaks git --redact -v .
  codigo:
    runs-on: lab
    env:
      SEMGREP_VERSION: 1.97.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar Semgrep
        run: |
          apt-get update -qq && apt-get install -y -qq python3-venv > /dev/null
          python3 -m venv /tmp/semgrep
          /tmp/semgrep/bin/pip install -q "semgrep==${SEMGREP_VERSION}"
      - name: Analisar código
        run: |
          /tmp/semgrep/bin/semgrep scan \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            --config .semgrep/zsec.yml \
            --metrics=off \
            --error
  dependencias:
    runs-on: lab
    env:
      TRIVY_VERSION: 0.75.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Bibliotecas do app (bun audit)
        run: bun audit --audit-level=high
      - name: Instalar Trivy
        run: |
          cd /tmp
          base=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
          curl -sSfLO $base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          curl -sSfLO $base/trivy_${TRIVY_VERSION}_checksums.txt
          grep Linux-64bit.tar.gz trivy_${TRIVY_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz trivy
          install trivy /usr/local/bin/
      - name: Demais dependências (Trivy)
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 .
  rls:
    runs-on: lab
    env:
      # Commit revisado do vibe-scanner (sem releases publicadas); trocar só após revisar o novo código.
      VIBE_SCANNER_COMMIT: d1f43205d2ede860d505cdb215842a88ac529ce2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar vibe-scanner
        run: |
          apt-get update -qq && apt-get install -y -qq python3-venv > /dev/null
          git clone -q https://github.com/SymbioticSec/vibe-scanner /tmp/vibe-scanner
          git -C /tmp/vibe-scanner checkout -q "$VIBE_SCANNER_COMMIT"
          python3 -m venv /tmp/vs
          /tmp/vs/bin/pip install -q -r scripts/ci/rls-scanner-requirements.txt
      - name: Analisar RLS das migrations
        run: |
          # O scanner sai com erro sempre que há achado alto/crítico; quem decide
          # se o job falha é a comparação com a linha de base, no passo seguinte.
          (cd /tmp/vibe-scanner && PYTHONPATH=. /tmp/vs/bin/python -m src.main \
            "$GITHUB_WORKSPACE/supabase/" -o json -f /tmp/rls.json) || true
          test -s /tmp/rls.json
      - name: Comparar com a linha de base
        run: python3 scripts/ci/rls_baseline.py /tmp/rls.json .rls-baseline supabase/migrations
  deploy-hmg:
    # Só depois do merge na main e com as 5 checagens verdes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, segredos, codigo, dependencias, rls]
    runs-on: lab
    container:
      image: node:22-bookworm
      # Único job com acesso ao Docker da VM (liberado em valid_volumes do runner).
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      DOCKER_VERSION: 27.5.1
      IMAGEM: zsec-hmg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar Docker CLI
        run: |
          curl -sSfL https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz \
            | tar -xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/
          docker version --format 'cliente {{.Client.Version}} / servidor {{.Server.Version}}'
      - name: Montar imagem
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL="${{ vars.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -t "$IMAGEM:${{ github.sha }}" -t "$IMAGEM:latest" .
      - name: Trocar container
        run: |
          docker network create zsec 2>/dev/null || true
          docker rm -f "$IMAGEM" 2>/dev/null || true
          docker run -d --name "$IMAGEM" --restart unless-stopped --network zsec \
            -v /home/zsec/zsec-hmg:/run/zsec:ro \
            -p 127.0.0.1:3000:3000 \
            "$IMAGEM:${{ github.sha }}"
      - name: Conferir se subiu
        run: |
          sleep 8
          docker logs --tail 20 "$IMAGEM"
          test "$(docker inspect -f '{{.State.Running}}' "$IMAGEM")" = true
      - name: Limpar imagens antigas (mantém as 3 últimas)
        run: |
          docker images "$IMAGEM" --format '{{.Tag}}' | grep -v '^latest$' | tail -n +4 \
            | xargs -r -I{} docker rmi "$IMAGEM:{}"
